[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cornerstone-agent"
version = "0.3.3"
description = "Cornerstone 边缘 Agent：编排 P0/P1 tools + A1 多任务 SQLite 时序。"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "LECO / Cornerstone Agent" }]
dependencies = []

[project.scripts]
cornerstone-agent = "cornerstone_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cornerstone_agent = ["py.typed", "ui_static/*"]
